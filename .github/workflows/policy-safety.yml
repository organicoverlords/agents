name: policy-safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy-safety:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run policy safety suite
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-PolicyToolSafety.ps1
